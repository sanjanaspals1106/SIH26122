[pytest]
markers =
    live_llm: hits the real configured LLM_PROVIDER (Groq/Gemini free tier) over the network.
        Inherently nondeterministic (model output quality/availability varies run to run) and
        must never be part of the deterministic core regression suite. Excluded by default
        (see addopts below); run explicitly with `pytest -m live_llm` or `pytest -m ""` for
        everything including live tests.

addopts = -m "not live_llm"
